[package]
name = "re-tools"
description = "Herramientas de análisis del volcado de nightreign.exe (no se distribuyen con el mod)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "disasm"
path = "src/main.rs"

[dependencies]
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
